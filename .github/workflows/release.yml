name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Validate version and check PyPI
        id: metadata
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from packaging.version import Version

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          if project["name"] != "ultraviz" or str(Version(version)) != version:
              raise SystemExit("Expected ultraviz with a canonical PEP 440 version")
          tree = ast.parse(Path("src/ultraviz/__init__.py").read_text())
          package_versions = [
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          ]
          if package_versions != [version]:
              raise SystemExit("pyproject.toml and ultraviz.__version__ must match")
          try:
              with urlopen(f"https://pypi.org/pypi/ultraviz/{version}/json", timeout=30):
                  publish = False
          except HTTPError as error:
              if error.code != 404:
                  raise
              publish = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\npublish={str(publish).lower()}\n")
          message = "Publishing" if publish else "Already on PyPI, skipping"
          print(f"{message}: ultraviz {version}")
      - name: Build distributions
        if: steps.metadata.outputs.publish == 'true'
        run: python -m build
      - name: Check distribution metadata
        if: steps.metadata.outputs.publish == 'true'
        run: python -m twine check --strict dist/*
      - name: Store distributions
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ultraviz/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # A retry after a partial upload can finish the same release.
          skip-existing: true
